name: Release

# Builds Snapr.exe and attaches it to a GitHub release.
# - Publish a release on GitHub (any tag, e.g. "0.2" or "v0.2.0") and the exe is added automatically.
# - Or run this workflow by hand with an existing release tag to (re)attach the exe.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release exe
        shell: pwsh
        run: |
          # build.rs strips a leading "v" and puts the version in the exe's version info.
          $env:SNAPR_VERSION = $env:TAG
          cargo build --release

      - name: Attach Snapr.exe to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG target/release/Snapr.exe --clobber
